[package]
name = "z-engine-gui"
description = "Desktop shell (Tauri 2) over the z-engine v2 engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "zengine-gui"
path = "src/main.rs"

[features]
# The decision model's native runtime (Laya through ONNX Runtime); off by default.
onnx = ["z-engine-engine/onnx"]

[dependencies]
z-engine-engine.workspace = true
z-engine-protocol.workspace = true
z-engine-config.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
anyhow = "1"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
tempfile.workspace = true
window-vibrancy = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
