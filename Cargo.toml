[workspace]
exclude = ["tmp"]
resolver = "3"
members = [
    # engine (see AGENTS.md)
    "crates/z-engine-protocol",
    "crates/z-engine-prompts",
    "crates/z-engine-llm",
    "crates/z-engine-config",
    "crates/z-engine-policy",
    "crates/z-engine-host",
    "crates/z-engine-integrations",
    "crates/z-engine-context",
    "crates/z-engine-verify",
    "crates/z-engine-store",
    "crates/z-engine-decisions",
    "crates/z-engine-tools",
    "crates/z-engine-engine",
    "crates/z-engine-testkit",
    # desktop application
    "crates/z-engine-gui/src-tauri",
]

[workspace.package]
version = "2.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Arshad Barves"]

[workspace.dependencies]
# internal (v2)
z-engine-protocol = { path = "crates/z-engine-protocol" }
z-engine-prompts = { path = "crates/z-engine-prompts" }
z-engine-llm = { path = "crates/z-engine-llm" }
z-engine-config = { path = "crates/z-engine-config" }
z-engine-policy = { path = "crates/z-engine-policy" }
z-engine-host = { path = "crates/z-engine-host" }
z-engine-integrations = { path = "crates/z-engine-integrations" }
z-engine-context = { path = "crates/z-engine-context" }
z-engine-verify = { path = "crates/z-engine-verify" }
z-engine-store = { path = "crates/z-engine-store" }
z-engine-decisions = { path = "crates/z-engine-decisions" }
z-engine-tools = { path = "crates/z-engine-tools" }
z-engine-engine = { path = "crates/z-engine-engine" }
z-engine-testkit = { path = "crates/z-engine-testkit" }

# external
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
async-trait = "0.1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
toml = "0.9"
dirs = "6"
futures = "0.3"
globset = "0.4"
regex = "1"
ignore = "0.4"
similar = "2"
strsim = "0.11"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
semver = "1"
sha2 = "0.10"
base64 = "0.22"
htmd = "0.5"
pdf-extract = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
which = "7"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
# the decision model's native runtime (optional `onnx` feature); rc.10 keeps MSRV 1.85
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# dev-dependencies shared across crates
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
