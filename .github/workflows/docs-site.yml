name: docs-site

on:
  push:
    branches: [release]
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run waits instead of cancelling the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the pages' last-updated dates
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/configure-pages@v5
      - run: npm ci --prefix website
      - run: npm run build --prefix website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
