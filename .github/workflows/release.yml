# Build macOS, Windows, and Linux on every push/merge to `release`.
# Pull requests targeting `release` build artifacts only (no GitHub Release).
name: release


on:
  workflow_dispatch:
  push:
    branches: [release]
  pull_request:
    branches: [release]


concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: write


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            os_name: macos-aarch64
            cli_path: target/aarch64-apple-darwin/release/zengine
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            os_name: macos-x86_64
            cli_path: target/x86_64-apple-darwin/release/zengine
          - platform: ubuntu-22.04
            args: ""
            os_name: linux-x64
            cli_path: target/release/zengine
          - platform: windows-latest
            args: ""
            os_name: windows-x64
            cli_path: target/release/zengine.exe


    runs-on: ${{ matrix.platform }}


    steps:
      - uses: actions/checkout@v4


      - name: Install Linux WebKitGTK
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: crates/z-engine-gui/ui/package-lock.json


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}


      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target


      - name: Install frontend dependencies
        run: npm ci
        working-directory: crates/z-engine-gui/ui

      - name: Build frontend
        run: npm run build
        working-directory: crates/z-engine-gui/ui


      - name: Build GUI
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/z-engine-gui/src-tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          # PRs build installers as workflow artifacts; push/dispatch publishes.
          tagName: ${{ github.event_name != 'pull_request' && 'v__VERSION__' || '' }}
          releaseName: Z Engine v__VERSION__
          releaseBody: Desktop and CLI builds for macOS, Windows, and Linux.
          releaseDraft: false
          prerelease: false


      - name: Build TUI CLI
        run: cargo build --release -p z-engine-tui --locked ${{ matrix.args }}


      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: zengine-cli-${{ matrix.os_name }}
          path: ${{ matrix.cli_path }}
          if-no-files-found: error
